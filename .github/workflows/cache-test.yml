# One-off diagnostic for stale CardTrader marketplace-API data. Trigger manually on
# this branch only; delete together with cloud/cache-test.js once the question is settled.
name: CardTrader cache test
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node cloud/cache-test.js
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
