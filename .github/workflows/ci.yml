name: CI

on:
  pull_request:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Syntax check all JS
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: Unit tests
        run: npm test
      # Runs here and not in `npm test` because it needs the network: a Claude Code web
      # session (and any offline dev box) can't reach api.scryfall.com, and a config
      # guard that only works on the runner still catches a wrong code before it ships.
      # It degrades to a warning when Scryfall doesn't answer, so it can't gate on flake.
      - name: Validate set codes against Scryfall
        run: node cloud/verify-set-codes.js
      - name: Install dependencies
        run: npm ci
      # Two commands, not `install --with-deps`, and the deps half may fail. On this image
      # the "deps" are nine font packages (CJK, unifont, freefont, xfonts) — every shared
      # library Chromium needs is already present — and on 2026-11-11 the runners could
      # not resolve the Ubuntu mirrors for over an hour, so both browser checks died
      # before they ran, over fonts that none of the asserted layout uses. The browser is
      # downloaded first so it is there whatever apt does; a warning marks a degraded run.
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::playwright install-deps failed (apt could not fetch the font packages); running the browser checks with the image's own fonts"
      - name: UI smoke test (render + responsive overflow)
        run: node cloud/verify-mobile.js
      - name: Refresh-button behaviour (dispatch payload, token, budget state)
        run: node cloud/verify-refresh.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: cloud/shot-*.png
