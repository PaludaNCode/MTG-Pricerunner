# TEMPORARY — one-shot diagnostic for the 2026-10-19 CardTrader 403s. Runs once on push
# to this branch only, makes two API requests, publishes nothing. Delete before any PR.
name: Probe CardTrader (temporary)

on:
  push:
    branches: [fix/log-cardtrader-rejection]
    paths: [".github/workflows/probe-cardtrader.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner public IP
        run: curl -sS --max-time 10 https://api.ipify.org; echo
      - name: One card, UA variants
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: |
          node - <<'JS'
          const token = process.env.CARDTRADER_TOKEN || "";
          console.log("token present:", token.length > 0, "length:", token.length);
          const show = ["server", "cf-ray", "cf-mitigated", "content-type", "retry-after",
            "x-ratelimit-limit", "x-ratelimit-remaining", "x-ratelimit-reset", "www-authenticate"];
          async function probe(label, url, ua) {
            const headers = { Authorization: "Bearer " + token, Accept: "application/json" };
            if (ua) headers["User-Agent"] = ua;
            const res = await fetch(url, { headers });
            console.log(`\n== ${label}: HTTP ${res.status} ${res.statusText}`);
            for (const h of show) if (res.headers.get(h)) console.log(`   ${h}: ${res.headers.get(h)}`);
            const body = await res.text();
            if (res.ok) {
              // Public log: never print the account payload, only its shape.
              try { const j = JSON.parse(body); console.log("   ok, keys:", Object.keys(j).join(", "),
                "| offers:", Array.isArray(j[232333]) ? j[232333].length : "n/a"); }
              catch { console.log("   ok, non-JSON body of", body.length, "chars"); }
            } else {
              console.log("   body:", body.replace(/\s+/g, " ").slice(0, 600));
            }
          }
          (async () => {
            const card = "https://api.cardtrader.com/api/v2/marketplace/products?blueprint_id=232333";
            await probe("one card, descriptive UA", card, "mtg-pricerunner/1.0 (+https://github.com/PaludaNCode/MTG-Pricerunner)");
            await probe("one card, browser UA", card, "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36");
          })();
          JS
      - name: One card via curl
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: |
          curl -sS -o /tmp/b -w "curl: HTTP %{http_code}\n" -H "Authorization: Bearer $CARDTRADER_TOKEN" \
            "https://api.cardtrader.com/api/v2/marketplace/products?blueprint_id=232333"
          head -c 120 /tmp/b; echo
