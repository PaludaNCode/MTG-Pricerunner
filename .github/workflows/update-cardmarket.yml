name: Update Cardmarket data

# ON DEMAND ONLY — there is deliberately no `schedule:` and no `push:` trigger.
# Every Cardmarket scrape costs Firecrawl credits, so nothing here may start itself:
# the only way in is the site's "↻ CM" button or the Run workflow button, both of
# which are workflow_dispatch. Adding a cron back would silently spend money.
#
# Separate from "Update card data" for the same reason: CardTrader is a free API call
# every couple of minutes, and it must never be able to touch this job's credit ledger.
on:
  workflow_dispatch: # the site's "↻ CM" button, and Actions -> Run workflow
    inputs:
      force:
        description: "Ignore the TTL and per-run limit (the credit allowance still applies)"
        type: boolean
        default: true
      cards:
        description: "Comma-separated card names to scrape. Empty = every card, stalest first."
        type: string
        default: ""
      debug:
        description: "Publish one raw article row into meta.debug (for fixing the parser)"
        type: boolean
        default: false
      balance_only:
        description: "Just read the Firecrawl balance — scrapes nothing, costs nothing"
        type: boolean
        default: false

permissions:
  contents: write # force-push the data-cm branch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Never run two scrapes at once — they would double-spend the same daily allowance,
# and the loser's ledger update would be lost. Unlike the data job, do NOT cancel in
# progress: a cancelled run may have already spent credits without recording them.
concurrency:
  group: data-cm
  cancel-in-progress: false

jobs:
  publish-cardmarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The previous cardmarket.json is the budget ledger: cached offers, credits spent
      # today, and the learned cost per scrape. Losing it re-scrapes everything and
      # restarts the day's allowance, so read it straight off the branch rather than
      # through raw.githubusercontent's cache.
      - name: Pull the previous cardmarket.json (offers + credit ledger)
        run: |
          if git fetch --depth=1 origin data-cm 2>/dev/null &&
             git show FETCH_HEAD:cardmarket.json > /tmp/prev-cm.json 2>/dev/null; then
            echo "previous cardmarket.json: $(wc -c < /tmp/prev-cm.json) bytes"
          else
            rm -f /tmp/prev-cm.json
            echo "no previous cardmarket.json — first run, or the branch is missing"
          fi
      - name: Scrape Cardmarket -> cloud/web/cardmarket.json
        run: node cloud/build-cardmarket.js --prev /tmp/prev-cm.json
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CM_FORCE: ${{ inputs.force }}
          CM_CARDS: ${{ inputs.cards }}
          CM_DEBUG: ${{ inputs.debug }}
          CM_BALANCE_ONLY: ${{ inputs.balance_only }}
      # Same build-artifact pattern as the `data` branch: a single orphan commit,
      # force-pushed every run. Never branch from it or PR into it.
      - name: Publish cardmarket.json to the data-cm branch
        run: |
          d=$(mktemp -d)
          cp cloud/web/cardmarket.json "$d/"
          cd "$d"
          git init -b data-cm
          git add cardmarket.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "cardmarket $(date -u +%FT%TZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-cm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # No keepalive step: that exists to stop GitHub auto-disabling *scheduled*
      # workflows after 60 days of inactivity, and this one has no schedule.
