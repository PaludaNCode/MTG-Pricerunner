name: Update card data

on:
  schedule:
    # Fallback only — the real cadence is the external pinger (docs/external-pinger.md),
    # every 10 minutes; this matches it. Offset from the round minutes, where GitHub's
    # scheduler is least contended. Not faster: 55 printings every 2 minutes is what
    # earned the Cloudflare blocks of 2026-10-19 and 2026-11-11.
    - cron: "3-53/10 * * * *"
  workflow_dispatch: # manual run button + external pinger target
    inputs:
      probe_now:
        description: "Ignore an open CardTrader breaker and probe once now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config.json"
      - "cloud/build-data.js"
      - "cloud/fetch-cardtrader.js"
      - "shared/cards.js"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write # force-push the data branch
  actions: write # keepalive step re-enables this workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# a delayed cron pile-up should collapse to the newest run
concurrency:
  group: data
  cancel-in-progress: true

jobs:
  publish-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The previous data.json rides along for one reason: the CardTrader breaker in
      # build-data.js keeps its state in meta.cardtrader, and a challenged run republishes
      # the old file with that state instead of publishing nothing. The data branch may
      # not exist yet (first run) — then there is simply no --prev.
      - name: Fetch the previous data.json from the data branch
        run: |
          if git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:data.json > "$RUNNER_TEMP/prev-data.json"; then
            echo "PREV=$RUNNER_TEMP/prev-data.json" >> "$GITHUB_ENV"
          else
            echo "no previous data.json (first run, or the data branch is missing)"
          fi
      # CardTrader only; Cardmarket has its own workflow. Three outcomes: a fresh
      # data.json; the previous one with breaker state (Cloudflare challenged the run,
      # green with a warning); or no file at all (the breaker is still open — no request
      # was made). Only the first two publish.
      - name: Fetch CardTrader data -> cloud/web/data.json
        run: node cloud/build-data.js ${PREV:+--prev "$PREV"}
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          CT_PROBE_NOW: ${{ inputs.probe_now && 'true' || 'false' }}
      # The data branch is a build artifact: a single orphan commit, force-pushed
      # every run so history never grows. Never branch from it or PR into it.
      - name: Publish data.json to the data branch
        if: hashFiles('cloud/web/data.json') != ''
        run: |
          d=$(mktemp -d)
          cp cloud/web/data.json "$d/"
          cd "$d"
          git init -b data
          git add data.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data $(date -u +%FT%TZ)"
          # GitHub's git backend 500s now and then; a force-push of one orphan commit
          # is idempotent, so ride it out the same way Keepalive does.
          for delay in 2 4 8; do
            if git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data; then
              exit 0
            fi
            echo "push failed; retrying in ${delay}s"
            sleep "$delay"
          done
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # No CDN purge step: the cloud page reads data.json straight from raw.githubusercontent,
      # whose Fastly cache is max-age=300 and self-heals every ~5 min. jsDelivr was tried but its
      # purge API is rate-limited (throttled when called every run) and it caches @branch refs
      # ~12h, which pinned the site on stale snapshots — worse than raw for this update cadence.
      # Scheduled workflows are auto-disabled after 60 days without repo activity;
      # re-enabling on every run resets that clock deterministically.
      # GitHub's API 503s in short bursts, so ride those out with a few retries
      # instead of failing the run after the data has already been published.
      - name: Keepalive
        run: |
          for delay in 2 4 8; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-data.yml/enable"; then
              exit 0
            fi
            echo "keepalive attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-data.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
