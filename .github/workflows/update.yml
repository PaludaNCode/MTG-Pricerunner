name: Deploy site

# Deploys only when the UI/source actually changes. Data freshness is handled
# by update-data.yml, which publishes data.json to the `data` branch — the
# cloud page fetches it from raw.githubusercontent.com, no deploy needed.
on:
  workflow_dispatch: {} # manual run button
  push:
    branches: [main]
    paths: ["cloud/web/**", "shared/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy shared UI into the site
        run: cp shared/ui.css shared/render.js shared/app.js cloud/web/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cloud/web
      - id: deploy
        uses: actions/deploy-pages@v5
