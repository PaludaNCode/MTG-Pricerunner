name: Update card data & deploy

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 min (GitHub best-effort; often delayed)
  workflow_dispatch: {} # manual run button
  push:
    branches: [main]
    paths: ["cloud/**", "shared/**", "config.json", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

# don't let overlapping scheduled runs stack up
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch CardTrader data -> cloud/web/data.json
        run: node cloud/fetch-cardtrader.js
      - name: Copy shared UI into the site
        run: cp shared/ui.css shared/render.js shared/app.js cloud/web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/web
      - id: deploy
        uses: actions/deploy-pages@v4
