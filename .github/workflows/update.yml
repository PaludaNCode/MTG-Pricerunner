name: Deploy site

# Deploys only when the UI/source actually changes. Data freshness is handled
# by update-data.yml, which publishes data.json to the `data` branch — the
# cloud page fetches it from raw.githubusercontent.com (max-age=300, self-heals), no deploy needed.
on:
  workflow_dispatch: {} # manual run button
  push:
    branches: [main]
    paths: ["cloud/web/**", "shared/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Copy shared UI into the site
        run: cp shared/ui.css shared/render.js shared/app.js shared/favicon.svg shared/cardmarket-parse.js shared/cardmarket-client.js cloud/web/
      # Stamp asset URLs with the commit SHA so fresh HTML always pulls fresh
      # JS/CSS: Pages' CDN caches by full URL and a deploy purges nothing, so
      # unversioned URLs can serve a stale-mixed page for up to ~20 min.
      # index.html itself stays cacheable — this only guarantees HTML and
      # assets always match.
      - name: Cache-bust asset URLs with the commit SHA
        run: |
          sed -i "s/\(href=\"ui\.css\|href=\"favicon\.svg\|src=\"render\.js\|src=\"cardmarket-parse\.js\|src=\"cardmarket-client\.js\|src=\"app\.js\)\"/\1?v=${GITHUB_SHA}\"/g" cloud/web/index.html
          grep -c "?v=${GITHUB_SHA}" cloud/web/index.html | grep -qx 6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cloud/web
      - id: deploy
        uses: actions/deploy-pages@v5
