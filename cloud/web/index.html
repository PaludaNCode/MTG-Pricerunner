<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JP Card Watcher</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<header>
  <h1>🃏 JP Card Watcher <span class="sub">CardTrader · Japanese</span></h1>
  <span class="live"><span class="dot"></span>live</span>
  <span id="fetching" class="meta"></span>
  <span class="spacer"></span>
  <span id="updated" class="meta">loading…</span>
</header>
<div id="watching" class="watching"></div>
<div id="grid"></div>

<!-- On Pages, data comes from the `data` branch (updated by update-data.yml without a deploy),
     served from raw.githubusercontent.com. Its Fastly CDN caches max-age=300, so staleness is
     bounded to ~5 min and self-heals every cycle — a good fit for the ~2-5 min update cadence.
     We deliberately do NOT use jsDelivr here: it caches @branch refs for ~12h and its purge API
     is rate-limited, so purging every run gets throttled and the site sticks on a stale snapshot.
     On localhost (verify-mobile.js), the relative path keeps the smoke test offline. -->
<script>window.DASH = { url: location.hostname.endsWith("github.io") ? "https://raw.githubusercontent.com/PaludaNCode/MTG-Pricerunner/data/data.json" : "data.json", intervalMs: 60000, showSrc: false };</script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
