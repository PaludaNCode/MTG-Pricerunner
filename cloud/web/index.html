<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JP Card Watcher</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<!-- Header and control strip travel together: on a desktop the pair is pinned to the
     top (see .topbar in ui.css), so the source filter and the selection are reachable
     without scrolling back up. Wrapping them is what makes that a two-line CSS change —
     the strip alone would need the header's height, which changes as the header wraps. -->
<div class="topbar">
<header>
  <h1>🃏 JP Card Watcher <span class="sub">CardTrader · Cardmarket · Japanese</span></h1>
  <span class="live"><span class="dot"></span>live</span>
  <span class="spacer"></span>
  <span id="updated" class="meta">loading…</span>
</header>
<!-- Control strip: everything that decides what the next refresh shows and costs.
     Left is free (a client-side filter over the merged feeds); right spends credits.
     The scrape is only usable by someone holding a GitHub PAT with Actions: write —
     typed into the field here and kept in this browser's localStorage, never in this
     page. app.js wires all of it. -->
<div class="controls">
  <span class="ctl-label" id="src-label">Source</span>
  <span id="src-filter" class="seg" role="group" aria-labelledby="src-label">
    <button type="button" data-src="all" aria-pressed="true">Both</button>
    <button type="button" data-src="cardtrader" aria-pressed="false" title="CardTrader offers only">CT</button>
    <button type="button" data-src="cardmarket" aria-pressed="false" title="Cardmarket offers only">CM</button>
  </span>
  <span class="spacer"></span>
  <span id="cm-group" class="ctl-group">
    <span id="pick-count" class="ctl-count"></span>
    <button id="cm-all" class="btn" type="button" title="Tick every Cardmarket-watched card">Select all</button>
    <button id="cm-none" class="btn" type="button" title="Untick every card">Clear</button>
    <span class="ctl-sep"></span>
    <input id="cm-token" class="token" type="password" autocomplete="off" spellcheck="false"
           placeholder="GitHub token (ghp_… / github_pat_…)" aria-label="GitHub token for the Cardmarket refresh" hidden />
    <button id="cm-token-toggle" class="refresh key" type="button" title="Set or clear the GitHub token">⚿</button>
    <button id="cm-refresh" class="refresh" type="button" title="Scrape Cardmarket now">↻ CM</button>
  </span>
</div>
</div>
<div id="legend" class="legend"></div>
<div id="notice" class="notice" hidden></div>
<div id="watching" class="watching"></div>
<div id="grid"></div>

<!-- Two feeds, two branches, two cadences: `data` holds CardTrader (update-data.yml, every
     couple of minutes) and `data-cm` holds Cardmarket (update-cardmarket.yml, hourly at most —
     it is metered scraping). Both are served from raw.githubusercontent.com, whose Fastly CDN
     caches max-age=300, so staleness is bounded to ~5 min and self-heals every cycle.
     We deliberately do NOT use jsDelivr here: it caches @branch refs for ~12h and its purge API
     is rate-limited, so purging every run gets throttled and the site sticks on a stale snapshot.
     On localhost (verify-mobile.js), the relative paths keep the smoke test offline. -->
<script>window.DASH = (function () {
  var live = location.hostname.endsWith("github.io");
  var raw = "https://raw.githubusercontent.com/PaludaNCode/MTG-Pricerunner/";
  return {
    url: live ? raw + "data/data.json" : "data.json",
    cmUrl: live ? raw + "data-cm/cardmarket.json" : "cardmarket.json",
    intervalMs: 60000,
    // Target for the "↻ CM" button. force:true is sent as a workflow input so a manual
    // press ignores the TTL — the credit allowance still caps what it can spend.
    // dataBranch/dataFile let a signed-in refresh read the result straight from the
    // branch. raw.githubusercontent caches for 5 minutes, so polling it after a run
    // reports "timed out" while the data is already published.
    dispatch: {
      repo: "PaludaNCode/MTG-Pricerunner", workflow: "update-cardmarket.yml", ref: "main",
      dataBranch: "data-cm", dataFile: "cardmarket.json",
    },
  };
})();</script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
