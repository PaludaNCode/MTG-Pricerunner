<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JP Card Watcher</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<header>
  <h1>🃏 JP Card Watcher <span class="sub">CardTrader · Japanese</span></h1>
  <span class="live"><span class="dot"></span>live</span>
  <span id="fetching" class="meta"></span>
  <span class="spacer"></span>
  <button id="enableNotif">🔔 Notifications</button>
  <span id="updated" class="meta">loading…</span>
</header>
<div id="grid"></div>
<div id="watching" class="watching"></div>

<!-- On Pages, data comes from the `data` branch (updated by update-data.yml without a deploy);
     on localhost (verify-mobile.js), the relative path keeps the smoke test offline. -->
<script>window.DASH = { url: location.hostname.endsWith("github.io") ? "https://raw.githubusercontent.com/PaludaNCode/MTG-Pricerunner/data/data.json" : "data.json", intervalMs: 60000, showSrc: false };</script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
