<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTG Pricerunner — favicon prototypes</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #0e1016; color: #e7e9ee; margin: 0; padding: 24px; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  p.sub { color: #8b91a3; font-size: .8rem; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1100px; }
  .proto { background: #171a23; border: 1px solid #2a2f3d; border-radius: 12px; padding: 14px; }
  .proto h2 { font-size: .78rem; font-weight: 600; margin: 0 0 10px; color: #e7e9ee; }
  .proto h2 span { color: #8b91a3; font-weight: 400; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
  .row.dark { background: #202124; }
  .row.light { background: #dee1e6; }
  img { display: block; }
  .s64 { width: 64px; height: 64px; }
  .s32 { width: 32px; height: 32px; }
  .s16 { width: 16px; height: 16px; }
</style>
</head>
<body>
<h1>MTG Pricerunner — favicon prototypes</h1>
<p class="sub">Each icon at 64 / 32 / 16 px on a dark and a light browser tab bar.</p>
<div class="grid" id="grid"></div>
<script>
  const icons = [
    ["icon-01-card-yen.svg", "01 Card + ¥"],
    ["icon-02-fanned-cards.svg", "02 Fanned cards"],
    ["icon-03-price-tag.svg", "03 Price tag"],
    ["icon-04-price-drop.svg", "04 Price drop"],
    ["icon-05-torii.svg", "05 Torii + ¥"],
    ["icon-06-rising-sun-card.svg", "06 Rising-sun card"],
    ["icon-07-yen-coin.svg", "07 Yen coin"],
    ["icon-08-sparkle.svg", "08 Sparkle"],
    ["icon-09-monogram.svg", "09 M¥ monogram"],
    ["icon-10-card-pulse.svg", "10 Card + pulse"],
  ];
  document.getElementById("grid").innerHTML = icons.map(([file, name]) => `
    <div class="proto">
      <h2>${name}</h2>
      <div class="row dark">
        <img class="s64" src="${file}"><img class="s32" src="${file}"><img class="s16" src="${file}">
      </div>
      <div class="row light">
        <img class="s64" src="${file}"><img class="s32" src="${file}"><img class="s16" src="${file}">
      </div>
    </div>`).join("");
</script>
</body>
</html>
